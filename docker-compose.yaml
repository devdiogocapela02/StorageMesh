services:

  node1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    volumes:
      - ./config/node1.json:/app/StorageMesh.Server/node.json:ro
      - node1-data:/app/data

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    volumes:
      - ./config/node2.json:/app/StorageMesh.Server/node.json:ro
      - node2-data:/app/data

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    volumes:
      - ./config/node3.json:/app/StorageMesh.Server/node.json:ro
      - node3-data:/app/data

  node4:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    ports:
      - "5004:8080"
      - "5173:5173"
    volumes:
      - ./config/node4.json:/app/StorageMesh.Server/node.json:ro
      - node4-data:/app/data
      - ./storageMesh.client:/app/storagemesh.client
      - node4-node-modules:/app/storagemesh.client/node_modules
volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node4-node-modules: